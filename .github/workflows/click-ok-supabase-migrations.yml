name: CLICK OK - Supabase migrations

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    if: github.ref == 'refs/heads/click-ok-produccion'
    runs-on: ubuntu-latest
    environment: click-ok-staging
    steps:
      - name: Stop unsafe migration until schema preflight is verified
        run: |
          echo "::error::Migration blocked: the existing CLICKOK schema has not yet been fully verified against migration 0001."
          echo "Do not mark 202611050001 as applied based only on table names or column counts."
          echo "A verified preflight must check column types, constraints, indexes, enum values, functions, triggers, RLS policies and grants before applying migrations 0002 and 0003."
          exit 1
