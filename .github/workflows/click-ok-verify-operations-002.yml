name: CLICK OK - Verify operations migration 002

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-operations-002:
    if: github.ref == 'refs/heads/click-ok-produccion'
    runs-on: ubuntu-latest
    environment: click-ok-staging
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate secrets and link CLICKOK production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "::error::Missing SUPABASE_ACCESS_TOKEN" && exit 1)
          test -n "$SUPABASE_DB_PASSWORD" || (echo "::error::Missing SUPABASE_DB_PASSWORD" && exit 1)
          test -n "$SUPABASE_PROJECT_REF" || (echo "::error::Missing SUPABASE_PROJECT_REF" && exit 1)
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Verify operational tables and inventory columns (read-only)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          cat > /tmp/click-ok-operations-verification.sql <<'SQL'
          select 'table' as object_type, table_name as object_name, 'present' as details
          from information_schema.tables
          where table_schema = 'public'
            and table_name in ('order_items','inventory_movements','cash_sessions','cash_movements')
          union all
          select 'column' as object_type, column_name as object_name, data_type as details
          from information_schema.columns
          where table_schema = 'public'
            and table_name = 'products'
            and column_name in ('track_inventory','stock_quantity','low_stock_threshold')
          order by object_type, object_name;
          SQL
          supabase db query --linked --read-only --file /tmp/click-ok-operations-verification.sql
