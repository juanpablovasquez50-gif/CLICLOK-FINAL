name: CLICK OK - Quality check

on:
  push:
    branches: [click-ok-produccion, click-ok-public-storefront]
  pull_request:
    branches: [click-ok-produccion]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build workspace
        env:
          NODE_ENV: production
          PORT: "4173"
          BASE_PATH: /
        run: pnpm run build
